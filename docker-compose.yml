services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shortlink}
      MYSQL_USER: ${MYSQL_USER:-shortlink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shortlink}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shortlink}
      DB_USER: ${MYSQL_USER:-shortlink}
      DB_PASSWORD: ${MYSQL_PASSWORD:-shortlink}
      REDIS_HOST: redis
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
